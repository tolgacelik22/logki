# klog-ai Landing - Production Compose
# 
# Runs behind Traefik on external traefik-net network.
# 
# Prerequisites:
#   - Traefik running with letsencrypt certresolver
#   - External network: docker network create traefik-net
#   - DNS: klog.atlas-di.app A record pointing to server IP
#
# Deploy:
#   ADMIN_KEY=your-secret-key docker compose -f compose.prod.yml up -d --build
#
# View leads:
#   curl "https://klog.atlas-di.app/api/admin/leads?key=your-secret-key"

services:
  klog-landing:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: klog-landing
    restart: always
    environment:
      - PORT=8080
      - DB_PATH=/data/leads.db
      - ADMIN_KEY=${ADMIN_KEY:-}
    volumes:
      - klog_leads_data:/data
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      # HTTP router
      - "traefik.http.routers.klog.rule=Host(`klog.atlas-di.app`)"
      - "traefik.http.routers.klog.entrypoints=websecure"
      - "traefik.http.routers.klog.tls=true"
      - "traefik.http.routers.klog.tls.certresolver=letsencrypt"
      # Service
      - "traefik.http.services.klog.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  traefik-net:
    external: true

volumes:
  klog_leads_data:
    name: klog_leads_data

